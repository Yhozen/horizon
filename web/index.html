<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horizon (browser build)</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  canvas#horizon { display: block; width: 1280px; height: 720px; background: #000; outline: none; }
  #status { padding: 6px 10px; white-space: pre-wrap; }
  #session { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  input, button { font: inherit; padding: 6px 10px; }
</style>
</head>
<body>
<form id="session">
  <label>Player name <input id="player-name" name="name" maxlength="16" pattern="[A-Za-z0-9_]{1,16}" required autocomplete="off"></label>
  <button name="mode" value="multiplayer">Join multiplayer</button>
  <button name="mode" value="singleplayer">Single player</button>
</form>
<p id="multiplayer-note" hidden style="margin: 0; padding: 0 10px 8px">Multiplayer preview: the shared world resets when the server restarts.</p>
<canvas id="horizon" width="1280" height="720" tabindex="0"></canvas>
<div id="status">Loading…</div>
<script type="module" src="./loader.js"></script>
</body>
</html>
