[package]
name = "horizon-open-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A translating relay that lets Horizon Open Creative players join a vanilla or Paper 26.3 server"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
horizon-protocol = { path = "../horizon-protocol" }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
# Fetching the official server jar (`vanilla-data`); rustls, no system OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls"] }

[lints]
workspace = true
